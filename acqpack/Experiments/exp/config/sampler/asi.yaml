# Set the following to match your device's connection settings
serial: 
  port: COM8           # () com port
  baudrate: 57600     # (115200) baud rate
  bytesize: 8          # (8) number of data bits # ignored for now
  parity: N            # (N) enable parity checking # ignored for now
  stopbits: 1          # (1) number of stopbits # ignored for now
  timeout:             # () read timeout value # ignored for now
  xonxoff: False       # (False) enable software flow control # ignored for now
  rtscts: False        # (False) enable hardware (RTS/CTS) flow control # ignored for now
  writeTimeout:        # () write timeout value # ignored for now
  dsrdtr: False        # (False) enable hardware (DSR/DTR) flow control # ignored for now
  interCharTimeout:    # () 

prefix: "" # ignored for now
terminator: "\r"       # character to tell controller to run buffer contents # ignored for now

conv: 10000            # (10000) number of stage units per mm (eg 10000 ASI units = 1 mm) #BF not needed! unit is already mm

init_dir:
  x_dir: 1             # (1) direction to seek hall-effect limit when initializing (-1 min, +1 max)
  y_dir: 1             # (1) direction to seek hall-effect limit when initializing (-1 min, +1 max)